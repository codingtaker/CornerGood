name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the schema tests; it disappears after the job.
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cornergood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cornergood_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/cornergood_test
      - run: npm run build
